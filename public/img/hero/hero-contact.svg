<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360"><style>
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7.5s ease-in-out -2s infinite}.fl3{animation:fl 5s ease-in-out -1s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.pu{animation:pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.da{stroke-dasharray:7 9;animation:da 2.4s linear infinite}@keyframes da{to{stroke-dashoffset:-64}}
.sw{animation:sw 4.4s ease-in-out infinite}@keyframes sw{0%{transform:translateY(0);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateY(357px);opacity:0}}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.bar{animation:bar 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes bar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.62)}}
.fly{animation:fly 5s ease-in-out infinite}@keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-12px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs></defs>
<path class="da" d="M50 110C120 30 300 20 420 90" fill="none" stroke="#ffb100" stroke-width="3" stroke-linecap="round"/>
<g class="fly"><path d="M428 84l-44-26 12 30-12 20z" fill="#fafaf7"/><path d="M396 88l-12-30" stroke="#0b0b0f" stroke-opacity=".3" stroke-width="2"/></g>
<g class="fl2"><rect x="90" y="130" width="280" height="180" rx="16" fill="#fafaf7"/><path d="M96 142l134 100 134-100" fill="none" stroke="#ff0033" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 302l96-80M364 302l-96-80" stroke="#101014" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/></g>
<g class="fl3"><rect x="300" y="214" width="130" height="70" rx="22" fill="#1c1c22" stroke="#ff0033" stroke-opacity=".8" stroke-width="1.5"/><path d="M340 282l-4 24 26-22z" fill="#1c1c22" stroke="#ff0033" stroke-opacity=".8"/><circle class="tw" cx="332" cy="249" r="6" fill="#fafaf7"/><circle class="tw" style="animation-delay:.4s" cx="365" cy="249" r="6" fill="#fafaf7"/><circle class="tw" style="animation-delay:.8s" cx="398" cy="249" r="6" fill="#fafaf7"/></g>
<circle class="tw" style="animation-delay:0.0s" cx="60" cy="300" r="4" fill="#22c55e"/><circle class="tw" style="animation-delay:0.5s" cx="440" cy="200" r="3" fill="#fafaf7"/><circle class="tw" style="animation-delay:1.0s" cx="70" cy="200" r="3" fill="#ff3b5c"/></svg>