<g class="fl"><rect x="190" y="170" width="240" height="130" rx="28" fill="#fafaf7" stroke="#fff" stroke-opacity="1" stroke-width="1.5"/><path d="M398 298l20 36-52-28z" fill="#fafaf7"/><rect x="224" y="204" width="172" height="12" rx="6" fill="#101014" fill-opacity=".75"/><rect x="224" y="230" width="140" height="12" rx="6" fill="#101014" fill-opacity=".35"/><rect x="224" y="256" width="96" height="12" rx="6" fill="#101014" fill-opacity=".25"/><circle cx="396" cy="210" r="14" fill="#22c55e"/><path d="M389 210l5 5 9-10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
